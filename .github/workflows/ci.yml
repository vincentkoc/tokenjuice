name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality gates
        run: pnpm verify

  package:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package outputs
        run: pnpm verify:package

      - name: Verify installed hook contracts
        run: node scripts/hook-contracts.mjs

      - name: Install pinned OpenCode host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-opencode" --ignore-scripts --no-audit --no-fund opencode-linux-x64@1.19.5

      - name: Verify OpenCode model-visible tool results
        run: node scripts/opencode-e2e.mjs "$RUNNER_TEMP/tokenjuice-opencode/node_modules/opencode-linux-x64/bin/opencode"
