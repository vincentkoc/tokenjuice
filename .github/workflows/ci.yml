name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality gates
        run: pnpm verify

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  codex-native:
    runs-on: macos-15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native fixture CLI
        run: pnpm build

      - name: Install pinned Codex host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.166.0

      - name: Verify Codex model-visible tool results
        run: node scripts/codex-e2e.mjs "$RUNNER_TEMP/tokenjuice-codex/node_modules/.bin/codex"

  grok-native:
    runs-on: macos-15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native fixture CLI
        run: pnpm build

      - name: Extract pinned community Grok standalone
        run: |
          mkdir -p "$RUNNER_TEMP/tokenjuice-grok"
          npm pack grok-dev@1.1.7 --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/tokenjuice-grok"
          tar -xzf "$RUNNER_TEMP/tokenjuice-grok/grok-dev-1.1.7.tgz" -C "$RUNNER_TEMP/tokenjuice-grok" --strip-components=2 package/dist/grok-standalone

      - name: Verify community Grok model-visible tool results
        run: node scripts/grok-cli-e2e.mjs "$RUNNER_TEMP/tokenjuice-grok/grok-standalone"

  package:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package outputs
        run: pnpm verify:package

      - name: Verify isolated DeepSeek bundle
        run: TOKENJUICE_STATS=off node scripts/deepseek-bundle-contract.mjs

      - name: Verify installed hook contracts
        run: node scripts/hook-contracts.mjs

      - name: Install pinned Kimi Code host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-kimi" --ignore-scripts --no-audit --no-fund @moonshot-ai/kimi-code@2.4.1

      - name: Verify Kimi Code model-visible tool results
        run: node scripts/kimi-e2e.mjs "$RUNNER_TEMP/tokenjuice-kimi/node_modules/@moonshot-ai/kimi-code/dist/main.mjs"

      - name: Install pinned Gemini CLI host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-gemini" --ignore-scripts --no-audit --no-fund @google/gemini-cli@0.66.0

      - name: Verify Gemini CLI model-visible tool results
        run: node scripts/gemini-e2e.mjs "$RUNNER_TEMP/tokenjuice-gemini/node_modules/@google/gemini-cli/bundle/gemini.js"

      - name: Install pinned Qwen Code host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-qwen" --ignore-scripts --no-audit --no-fund @qwen-code/qwen-code@0.26.4

      - name: Verify Qwen Code model-visible tool results
        run: node scripts/qwen-e2e.mjs "$RUNNER_TEMP/tokenjuice-qwen/node_modules/@qwen-code/qwen-code/cli-entry.js"

      - name: Install pinned OpenCode host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-opencode" --ignore-scripts --no-audit --no-fund opencode-linux-x64@1.19.5

      - name: Verify OpenCode model-visible tool results
        run: node scripts/opencode-e2e.mjs "$RUNNER_TEMP/tokenjuice-opencode/node_modules/opencode-linux-x64/bin/opencode"

      - name: Install pinned OpenCode V2 host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-opencode-v2" --ignore-scripts --no-audit --no-fund @opencode/cli-linux-x64@2.0.18

      - name: Verify OpenCode V2 model-visible tool results
        run: node scripts/opencode-v2-e2e.mjs "$RUNNER_TEMP/tokenjuice-opencode-v2/node_modules/@opencode/cli-linux-x64/bin/opencode"

      - name: Install pinned Copilot CLI host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-copilot-cli" --ignore-scripts --no-audit --no-fund @github/copilot-linux-x64@1.0.105

      - name: Verify Copilot CLI model-visible tool results
        run: node scripts/copilot-cli-e2e.mjs "$RUNNER_TEMP/tokenjuice-copilot-cli/node_modules/@github/copilot-linux-x64/copilot"
      - name: Install pinned Xum host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-xum" --ignore-scripts --omit=dev --no-audit --no-fund @coder/xum@0.32.1

      - name: Verify Mux/Xum model-visible tool results
        run: node scripts/mux-e2e.mjs "$RUNNER_TEMP/tokenjuice-xum/node_modules/@coder/xum/dist/cli/index.js"

      - name: Install pinned Cline CLI host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-cline" --ignore-scripts --no-audit --no-fund @cline/cli-linux-x64@3.0.74

      - name: Verify Cline CLI model-visible tool results
        run: node scripts/cline-e2e.mjs "$RUNNER_TEMP/tokenjuice-cline/node_modules/@cline/cli-linux-x64/bin/cline"

      - name: Install pinned Pi host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-pi" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0

      - name: Verify Pi model-visible tool results
        run: node scripts/pi-e2e.mjs "$RUNNER_TEMP/tokenjuice-pi/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js"

      - name: Install pinned Claude Code host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-claude" --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code-linux-x64@2.1.316

      - name: Verify Claude Code model-visible tool results
        run: node scripts/claude-e2e.mjs "$RUNNER_TEMP/tokenjuice-claude/node_modules/@anthropic-ai/claude-code-linux-x64/claude"

      - name: Install pinned CodeBuddy host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-codebuddy" --ignore-scripts --no-audit --no-fund @tencent-ai/codebuddy-code@2.179.0

      - name: Verify CodeBuddy model-visible tool results
        run: node scripts/codebuddy-e2e.mjs "$RUNNER_TEMP/tokenjuice-codebuddy/node_modules/@tencent-ai/codebuddy-code/bin/codebuddy"

      - name: Install pinned Droid host
        run: npm install --prefix "$RUNNER_TEMP/tokenjuice-droid" --ignore-scripts --no-audit --no-fund droid@1.1.0

      - name: Verify Droid model-visible tool results
        run: node scripts/droid-e2e.mjs "$RUNNER_TEMP/tokenjuice-droid/node_modules/droid/bin/droid"
